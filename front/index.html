<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Icônes : <svg><use href="#i-..."></use></svg> -->
  <svg xmlns="http://www.w3.org/2000/svg" hidden>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"></path></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.5 0 5.4 3.5 4.1 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"></path></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></symbol>
    <symbol id="i-search-off" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5M8.5 11h5"></path></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"></circle><path d="M4.5 20c1.3-3.6 4.2-5.4 7.5-5.4s6.2 1.8 7.5 5.4"></path></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19zM12 10v4.5M12 17.3v.2"></path></symbol>
    <symbol id="i-gamepad" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="4"></rect><path d="M8 11v4M6 13h4M15.5 12.5h.01M17.5 14.5h.01"></path></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"></path></symbol>
  </svg>

  <a class="skip-link" href="#main">Aller au contenu</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="logo" href="index.html" aria-label="Game Finder, accueil">
        <svg width="32" height="32" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="6" width="32" height="24" rx="8" fill="#FFB224"></rect><circle cx="12" cy="18" r="3.2" fill="#0D1015"></circle><rect x="21" y="16" width="8" height="4" rx="2" fill="#0D1015"></rect></svg>
        <span class="display logo__text">Game Finder</span>
      </a>

      <form class="site-search" id="search-form" role="search" action="index.html">
        <label for="search-input" class="sr-only">Rechercher un jeu</label>
        <div class="search">
          <svg class="icon i-stroke" width="18" height="18" aria-hidden="true"><use href="#i-search"></use></svg>
          <input id="search-input" name="search" type="search" placeholder="Rechercher parmi 500 000 jeux…" autocomplete="off">
          <kbd class="search__kbd">/</kbd>
        </div>
      </form>

      <nav class="site-nav" aria-label="Principale">
        <a class="nav-link" href="games.html">Jeux</a>
        <a class="nav-link" href="favorites.html">Favoris</a>
        <a class="nav-link" href="my-games.html">Mes jeux</a>
        <div class="profile">
          <button class="icon-btn profile__btn" id="profile-button" type="button" aria-expanded="false" aria-controls="profile-menu" aria-label="Menu du profil">
            <svg class="icon i-stroke i-thin" width="20" height="20" aria-hidden="true"><use href="#i-user"></use></svg>
          </button>
          <div class="menu" id="profile-menu" hidden>
            <div class="menu__head">
              <p class="menu__title">Visiteur anonyme</p>
              <p class="menu__sub">Votre compte est lié à ce navigateur</p>
            </div>
            <a href="favorites.html"><svg class="icon icon--accent i-stroke i-thin" width="18" height="18" aria-hidden="true"><use href="#i-heart"></use></svg>Mes favoris</a>
            <a href="my-games.html"><svg class="icon i-stroke i-thin" width="18" height="18" aria-hidden="true"><use href="#i-gamepad"></use></svg>Mes jeux</a>
            <a href="#" id="nickname-link"><svg class="icon i-stroke i-thin" width="18" height="18" aria-hidden="true"><use href="#i-pen"></use></svg>Mon pseudo d’avis</a>
          </div>
        </div>
      </nav>
    </div>
  </header>

  <main id="main" class="page">

    <!-- Genres : « Tous » ouvre games.html, un genre ouvre category.html?genre=<slug RAWG> -->
    <nav class="wrap" aria-labelledby="genres-title">
      <h2 id="genres-title" class="sr-only">Parcourir par genre</h2>
      <div class="pill-row" id="genre-list">
        <a class="pill" href="games.html">Tous</a>
        <a class="pill" href="category.html?genre=action">Action</a>
        <a class="pill" href="category.html?genre=role-playing-games-rpg">RPG</a>
        <a class="pill" href="category.html?genre=indie">Indé</a>
        <a class="pill" href="category.html?genre=adventure">Aventure</a>
        <a class="pill" href="category.html?genre=strategy">Stratégie</a>
        <a class="pill" href="category.html?genre=shooter">Shooter</a>
        <a class="pill" href="category.html?genre=racing">Course</a>
        <a class="pill" href="category.html?genre=puzzle">Puzzle</a>
        <a class="pill" href="category.html?genre=platformer">Plateforme</a>
      </div>
    </nav>

    <!-- Sorties récentes : carrousel -->
    <section class="wrap section" id="recent-section" aria-labelledby="recent-title">
      <div class="section-head">
        <div class="section-head__title">
          <h2 id="recent-title" class="display h2">Sorties récentes</h2>
        </div>
      </div>

      <ul class="list-reset scroller" id="recent-track">
        
      
      </ul>
    </section>

    
   <script type="module" src="js/request_api.js"></script>
  <script type="module" src="js/gamesRecent.js"></script>
</body>
</html>
