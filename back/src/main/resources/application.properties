spring.application.name=back

# Charge les variables du fichier .env (lancement depuis back/ ou depuis la racine du repo)
spring.config.import=optional:file:./.env[.properties],optional:file:./back/.env[.properties]

# Base de données MySQL
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Actuator : seule la route /actuator/health est exposée
management.endpoints.web.exposure.include=health

# API RAWG
rawg.api.base-url=https://api.rawg.io/api
rawg.api.key=${RAWG_API_KEY}
